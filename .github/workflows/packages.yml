name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole test suite runs here on Linux x86-64. The macOS, Windows and
  # Linux arm64 jobs repeat it, because they have their own code paths.
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt clippy
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "cheesecloth") | .version')
          # v<version>, maybe with a suffix such as "pre0" or "-rc1".
          suffix=${TAG#"v$version"}
          if [[ "$suffix" == "$TAG" || "$suffix" =~ ^[0-9.] ||
                ( "$version" == *-* && -n "$suffix" ) ]]; then
            echo "::error::tag $TAG does not match version $version"
            exit 1
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  # The oldest Rust in `rust-version` must still build everything.
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the minimum Rust
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "cheesecloth") | .rust_version')
          rustup toolchain install "$version" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo check --locked --workspace --all-targets

  # Security advisories, licenses and sources of the dependencies (deny.toml).
  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # The packages ship THIRD-PARTY-NOTICES.md; it must match Cargo.lock.
      - name: Check the third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate --fail about.hbs -o "$RUNNER_TEMP/notices.md"
          diff -u THIRD-PARTY-NOTICES.md "$RUNNER_TEMP/notices.md" ||
            { echo "::error::Run: cargo about generate --fail about.hbs -o THIRD-PARTY-NOTICES.md"; exit 1; }

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      # In the debug profile, like the checks job: it builds faster than the
      # release profile with LTO, and turns on debug assertions.
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test macOS userspace WireGuard
        timeout-minutes: 5
        run: |
          cargo test --locked -p cheesecloth-wg \
            --features macos-integration --test macos_userspace \
            --config 'target."cfg(target_os = \"macos\")".runner = ["sudo", "-n"]' \
            -- --nocapture
      # The release job adds the version to the name.
      - name: Collect the binary
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p bin
          cp target/release/cheesecloth "bin/cheesecloth-$triple"
          "bin/cheesecloth-$triple" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheesecloth-binary-macos-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      # A Windows install without the Visual C++ Redistributable has no C
      # runtime DLLs, so the binary must not need them. .cargo/config.toml
      # links the C runtime into it.
      - name: Check that the binary needs no C runtime DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $dlls = & $dumpbin /nologo /dependents target/release/cheesecloth.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $dlls
          $crt = $dlls | Select-String -Pattern '^\s*(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)'
          if ($crt) { throw "cheesecloth.exe needs C runtime DLLs: $($crt.Line.Trim() -join ', ')" }
      # The release job adds the version to the name.
      - name: Collect the binary
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p bin
          cp target/release/cheesecloth.exe "bin/cheesecloth-$triple.exe"
          "bin/cheesecloth-$triple.exe" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheesecloth-binary-windows-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error

  # Plain Linux binaries for the release. They link glibc dynamically, so they
  # need the glibc of Ubuntu 24.04 (2.39) or newer.
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      # The checks job runs the tests on x86-64 only.
      - name: Test
        if: matrix.arch == 'aarch64'
        run: cargo test --locked --workspace --no-fail-fast
      # The release job adds the version to the name.
      - name: Collect the binary
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p bin
          cp target/release/cheesecloth "bin/cheesecloth-$triple"
          "bin/cheesecloth-$triple" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheesecloth-binary-linux-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, msrv, deny, macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: cheesecloth-*
          merge-multiple: true
      # Each binary arrives as cheesecloth-<target>[.exe]. Add the version
      # (the tag without its "v"), and fail if a target is missing. The names
      # are a contract with the OS repositories: see "Contracts" in docs/DEVELOPMENT.md.
      - name: Name the binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          targets=(
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            aarch64-apple-darwin x86_64-apple-darwin
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            ext=
            if [[ "$target" == *-windows-* ]]; then
              ext=.exe
            fi
            mv -- "dist/cheesecloth-$target$ext" "dist/cheesecloth-${TAG#v}-$target$ext"
          done
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -l
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            # Only a plain vX.Y.Z tag is a full release; a suffix makes a
            # prerelease.
            flags=()
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}" -- *
          fi
