name: main
on: [push, pull_request]
# the token is read-only except where a job says otherwise
permissions:
  contents: read
jobs:
  test:
    env:
      LATEST_GO: 1.27.x # version used for release
    strategy:
      matrix:
        go: [ 1.26.x, 1.27.x ]
        os: [ ubuntu-latest ]
    name: ${{ matrix.os }}/go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: go test -race -v ./...

      # the wireguard interface, its addresses and routes, for real: needs root,
      # since a user namespace has CAP_NET_ADMIN but cannot write /var/run
      - name: Wireguard on a live interface
        run: sudo -E "$(command -v go)" test -count=1 -v ./internal/wg
        env:
          CHEESECLOTH_REQUIRE_PRIVILEGED: 1

      # unprivileged, so this understates the wireguard package: the device
      # and link code is most of it and all of it needs privilege. The runner
      # denies the user namespace coverage-privileged wants, and the live
      # wireguard step above already covers that code without a profile.
      - name: Coverage
        if: matrix.go == env.LATEST_GO
        run: make coverage

      - name: Cross-compile for macOS and Windows, tests included
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - run: make e2e

      # only the version that ships: the other run's binaries are not kept, so
      # cross-compiling them proves nothing go build in this job has not
      - name: Build the release binaries
        if: matrix.go == env.LATEST_GO
        run: make release TARGETS="linux/amd64 linux/arm linux/arm64 linux/mipsle linux/riscv64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        if: matrix.go == env.LATEST_GO
        with:
          name: binaries
          path: |
            cheesecloth-*
            cheesecloth.sha256sums
    
  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - run: go build ./... && go test -count=1 ./...
      # the utun interface, its addresses and routes, for real: needs root
      - name: One node, live
        run: sudo -E "$(command -v go)" test -count=1 -v -run Live ./internal/wg

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - run: go build ./... && go test -count=1 ./...
        shell: bash

  deb:
    name: deb/${{ matrix.arch }}
    runs-on: ubuntu-latest
    # Debian trixie with Go added: the package installs on trixie and on
    # Ubuntu 26.04 alike, since the binary is static.
    container: golang:1.27-trixie
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          apt-get update -qq
          apt-get install -y -qq debhelper dpkg-dev binutils-aarch64-linux-gnu
          git config --global --add safe.directory "$PWD"
      - name: Stamp the version from the tag
        run: |
          version=$(dist/version.sh deb)
          printf 'cheesecloth (%s) unstable; urgency=medium\n\n  * Built by CI from %s.\n\n -- %s  %s\n' \
            "$version" "$GITHUB_SHA" "Jonathan Anderson <janderson@vectorface.com>" "$(date -R)" > debian/changelog
      - run: dpkg-buildpackage -us -uc -b -d -a${{ matrix.arch }}
      - run: mkdir out && mv ../cheesecloth_*.deb out/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: out/*.deb

  arch:
    name: arch/x86_64
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm --needed base-devel git go
          useradd -m build
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the release package
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(dist/version.sh arch)
          sed -i "s/^pkgver=.*/pkgver=$version/" arch/release/PKGBUILD
          git archive --prefix="cheesecloth-$version/" -o "arch/release/cheesecloth-$version.tar.gz" HEAD
          chown -R build arch/release
          su build -c "cd arch/release && makepkg -f --noconfirm"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: arch/release/*.pkg.tar.zst

  check:
    name: vulncheck/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vulncheck
      - run: make lint

  release:
    name: release
    needs: [test, deb, arch]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'jdpanderson/cheesecloth'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            cheesecloth-*
            cheesecloth.sha256sums
            *.deb
            *.pkg.tar.zst

