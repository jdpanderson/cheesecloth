# cheesecloth configuration: one interface's settings, keyed by the
# command-line flag names. A flag given on the command line overrides the value
# here. Unknown keys are an error, and join-key is command line only, since it
# is a one-time secret.
#
# One file describes one interface. A host running a second cluster gives it
# its own file and names it with --config, which the agent has to be told
# anyway.
#
# Nothing is set below, so cheesecloth runs with its defaults. An agent that is
# not yet a member of a cluster and has no overlay-net to start one with waits
# until it is given something to act on. Set overlay-net to start a new cluster
# on the next restart, or enrol this node with
# 'cheesecloth --join HOST --join-key TOKEN'.
#
# Install as /etc/cheesecloth/config.yaml.

# the wireguard interface this node manages
#interface: wgcloth

# members to contact on start; leave out to resume from saved state
#join:
#  - node1.example.net
#  - node2.example.net

# address family of the cluster is decided here: 0.0.0.0 (IPv4) or :: (IPv6)
#bind-addr: 0.0.0.0
#cluster-port: 7946
#wireguard-port: 51820

# the cluster's overlay network. Setting it on a node with no state starts a
# new cluster with this node as its first member; a node joining an existing
# cluster is told the network at enrolment and keeps it, so it is not needed
# there.
#overlay-net: 10.0.0.0/8

# how many members must agree before a membership takes effect -- every
# admission and revocation goes through it: majority (the default), half, or a
# count. It is settled when the cluster is founded and read from its records
# afterwards, so it is only ever set on the node that starts a cluster.
# majority is the only value that cannot fork. Note that it also means a
# two-node cluster needs both nodes for any change at all.
#quorum: majority

# networks behind this node that peers should route through it
#allowed-ips:
#  - 192.168.7.0/24

#mtu: 1420
#persistent-keepalive: 25s
#no-etc-hosts: true
#log-level: warn
